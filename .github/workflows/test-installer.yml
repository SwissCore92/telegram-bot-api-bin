test-macos-arm64:
name: macOS Apple Silicon
runs-on: macos-15

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Check Bash syntax
    run: bash -n install.sh

  - name: Test help
    run: bash install.sh --help

  - name: Test installation
    run: |
      set -euo pipefail

      INSTALL_DIR="$RUNNER_TEMP/telegram-bot-api-test"

      bash install.sh --install-dir "$INSTALL_DIR"

      test -x "$INSTALL_DIR/telegram-bot-api"

      "$INSTALL_DIR/telegram-bot-api" --help

test-windows-amd64:
name: Windows AMD64
runs-on: windows-2025

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Test help
    shell: pwsh
    run: |
      & .\install.ps1 --help

  - name: Test installation
    shell: pwsh
    run: |
      $InstallDir = Join-Path $env:RUNNER_TEMP "telegram-bot-api-test"

      & .\install.ps1 --install-dir $InstallDir

      $BinaryPath = Join-Path $InstallDir "telegram-bot-api.exe"

      if (-not (Test-Path $BinaryPath)) {
          throw "Installed binary was not found at $BinaryPath"
      }

      & $BinaryPath --help
