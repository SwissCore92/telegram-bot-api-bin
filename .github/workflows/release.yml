          name: macos-arm64
          path: dist/

  # ============================================================
  # Publish Release
  # ============================================================

  release:
    name: Publish GitHub Release
    needs:
      - resolve
      - linux-amd64
      - linux-arm64
      - windows-amd64
      - macos-amd64
      - macos-arm64

    runs-on: ubuntu-latest

    steps:
      - name: Download Linux AMD64
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: release

      - name: Download Linux ARM64
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: release

      - name: Download Windows AMD64
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: release

      - name: Download macOS Intel
        uses: actions/download-artifact@v4
        with:
          name: macos-amd64
          path: release

      - name: Download macOS Apple Silicon
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release

      - name: Generate combined checksums
        working-directory: release
        shell: bash
        run: |
          cat *.sha256 > SHA256SUMS.txt

      - name: List release files
        run: |
          find release -maxdepth 1 -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          name: Telegram Bot API ${{ needs.resolve.outputs.version }}
          generate_release_notes: true
          prerelease: false
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/SHA256SUMS.txt