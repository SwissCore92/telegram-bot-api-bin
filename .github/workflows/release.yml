  # ============================================================
  # Windows AMD64
  # ============================================================

  windows-amd64:
    name: Windows AMD64
    needs: resolve
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone Telegram Bot API
        shell: pwsh
        run: |
          git clone --recursive `
            "$env:UPSTREAM_REPO" `
            telegram-bot-api

          Set-Location telegram-bot-api

          git checkout "${{ needs.resolve.outputs.upstream_ref }}"
          git submodule update --init --recursive

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git `
            "$env:GITHUB_WORKSPACE\vcpkg"

          Set-Location "$env:GITHUB_WORKSPACE\vcpkg"

          .\bootstrap-vcpkg.bat

      - name: Install dependencies
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install `
            gperf:x64-windows `
            openssl:x64-windows `
            zlib:x64-windows

      - name: Record source revision
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          git rev-parse HEAD |
            Out-File source-commit.txt -Encoding ascii

          Get-Content source-commit.txt

      - name: Configure
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          cmake `
            -S . `
            -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel

      - name: Install
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          cmake `
            --install build `
            --config Release

      - name: Package
        shell: pwsh
        run: |
          $VERSION = "${{ needs.resolve.outputs.version }}"
          $NAME = "telegram-bot-api-$VERSION-windows-amd64"

          New-Item `
            -ItemType Directory `
            -Force `
            "dist/$NAME" | Out-Null

          Copy-Item `
            "telegram-bot-api/install/bin/telegram-bot-api.exe" `
            "dist/$NAME/"

          if (-not (Test-Path "LICENSE_1_0.txt")) {
              throw "LICENSE_1_0.txt is missing from the repository."
          }

          Copy-Item `
              "LICENSE_1_0.txt" `
              "dist/$NAME/"

          Copy-Item `
            "telegram-bot-api/source-commit.txt" `
            "dist/$NAME/"

          Get-ChildItem `
            "telegram-bot-api/install/bin/*.dll" `
            -ErrorAction SilentlyContinue |
            Copy-Item -Destination "dist/$NAME/"

          Compress-Archive `
            -Path "dist/$NAME/*" `
            -DestinationPath "dist/$NAME.zip"

          $hash = (
            Get-FileHash `
              "dist/$NAME.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  $NAME.zip" |
            Out-File `
              "dist/$NAME.zip.sha256" `
              -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/
  # ============================================================
  # macOS Intel
  # ============================================================

  macos-amd64:
    name: macOS Intel
    needs: resolve
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            gperf \
            openssl \
            zlib

      - name: Clone Telegram Bot API
        run: |
          git clone --recursive \
            "$UPSTREAM_REPO" \
            telegram-bot-api

          cd telegram-bot-api
          git checkout "${{ needs.resolve.outputs.upstream_ref }}"
          git submodule update --init --recursive

      - name: Record source revision
        working-directory: telegram-bot-api
        run: |
          git rev-parse HEAD > source-commit.txt
          cat source-commit.txt

      - name: Build
        working-directory: telegram-bot-api
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"

          cmake \
            --build build \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

          cmake \
            --install build

      - name: Package
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME="telegram-bot-api-${VERSION}-macos-amd64"

          mkdir -p "dist/${NAME}"

          cp \
            telegram-bot-api/install/bin/telegram-bot-api \
            "dist/${NAME}/"

          test -f LICENSE_1_0.txt

          cp \
            LICENSE_1_0.txt \
            "dist/${NAME}/"

          cp \
            telegram-bot-api/source-commit.txt \
            "dist/${NAME}/"

          tar \
            -C dist \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"

          shasum -a 256 \
            "dist/${NAME}.tar.gz" \
            > "dist/${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-amd64
          path: dist/

  # ============================================================
  # macOS Apple Silicon
  # ============================================================

  macos-arm64:
    name: macOS Apple Silicon
    needs: resolve
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
