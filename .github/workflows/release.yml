      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME="telegram-bot-api-${VERSION}-linux-arm64"

          mkdir -p "dist/${NAME}"

          cp \
            telegram-bot-api/install/bin/telegram-bot-api \
