name: Build Telegram Bot API

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Telegram Bot API upstream ref (tag, branch, or commit)"
        required: true
        default: "master"

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/tdlib/telegram-bot-api.git
  VCPKG_VERSION: "2026.07.29"

jobs:
  resolve:
    name: Resolve upstream source
    runs-on: ubuntu-latest

    outputs:
      upstream_commit: ${{ steps.source.outputs.upstream_commit }}
      upstream_version: ${{ steps.source.outputs.upstream_version }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Determine upstream source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            UPSTREAM_REF="${{ inputs.upstream_ref }}"
          else
            UPSTREAM_REF="master"
          fi

          echo "Upstream ref: $UPSTREAM_REF"

          git clone --recursive \
            "$UPSTREAM_REPO" \
            telegram-bot-api

          cd telegram-bot-api

          git fetch --all --tags
          git checkout "$UPSTREAM_REF"
          git submodule update --init --recursive

          UPSTREAM_COMMIT="$(git rev-parse HEAD)"

          UPSTREAM_VERSION="$(
            sed -nE \
              's/^project\(TelegramBotApi VERSION ([0-9]+\.[0-9]+).*/\1/p' \
              CMakeLists.txt |
              head -n 1
          )"

          if [[ -z "$UPSTREAM_VERSION" ]]; then
            echo "ERROR: Could not determine Telegram Bot API version from CMakeLists.txt."
            exit 1
          fi

          echo "Upstream commit:  $UPSTREAM_COMMIT"
          echo "Upstream version: $UPSTREAM_VERSION"

          echo "upstream_commit=$UPSTREAM_COMMIT" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"

            echo "GitHub tag version: $RELEASE_VERSION"
            echo "Upstream version:   ${{ steps.source.outputs.upstream_version }}"

            if [[ "$RELEASE_VERSION" != "${{ steps.source.outputs.upstream_version }}" ]]; then
              echo "ERROR: Version mismatch."
              echo "GitHub tag:       $RELEASE_VERSION"
              echo "Upstream version: ${{ steps.source.outputs.upstream_version }}"
              exit 1
            fi

            echo "Version verification passed."

            echo "version=v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "Manual build."
            echo "Using upstream version: ${{ steps.source.outputs.upstream_version }}"

            echo "version=v${{ steps.source.outputs.upstream_version }}" >> "$GITHUB_OUTPUT"
          fi

  linux-amd64:
    name: Linux AMD64
    needs: resolve
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            g++ \
            make \
            gperf \
            libssl-dev \
            zlib1g-dev

      - name: Clone Telegram Bot API
        run: |
          git clone --recursive \
            "$UPSTREAM_REPO" \
            telegram-bot-api

          cd telegram-bot-api
          git fetch --all --tags
          git checkout "${{ needs.resolve.outputs.upstream_commit }}"
          git submodule update --init --recursive

      - name: Record source revision
        working-directory: telegram-bot-api
        run: |
          git rev-parse HEAD > source-commit.txt
          cat source-commit.txt

      - name: Build
        working-directory: telegram-bot-api
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

          cmake \
            --build build \
            --config Release \
            --parallel "$(nproc)"

          cmake \
            --install build

      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME="telegram-bot-api-${VERSION}-linux-amd64"

          mkdir -p "dist/${NAME}"

          cp telegram-bot-api/install/bin/telegram-bot-api \
            "dist/${NAME}/"

          test -f LICENSE_1_0.txt
          cp LICENSE_1_0.txt \
            "dist/${NAME}/"

          cp telegram-bot-api/source-commit.txt \
            "dist/${NAME}/"

          tar \
            -C dist \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"
          
          (
            cd dist
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/

  linux-arm64:
    name: Linux ARM64
