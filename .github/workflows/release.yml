            "dist/${NAME}/"

          test -f LICENSE_1_0.txt

          cp \
            LICENSE_1_0.txt \
            "dist/${NAME}/"

          cp \
            telegram-bot-api/source-commit.txt \
            "dist/${NAME}/"

          tar \
            -C dist \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"

          shasum -a 256 \
            "dist/${NAME}.tar.gz" \
