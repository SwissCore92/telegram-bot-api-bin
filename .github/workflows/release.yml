name: Build Telegram Bot API

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Telegram Bot API upstream ref (tag, branch, or commit)"
        required: true
        default: "master"

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/tdlib/telegram-bot-api.git

jobs:
  resolve:
    name: Resolve upstream source
    runs-on: ubuntu-latest

    outputs:
      upstream_ref: ${{ steps.ref.outputs.upstream_ref }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Determine upstream ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "upstream_ref=${{ inputs.upstream_ref }}" >> "$GITHUB_OUTPUT"
          else
            # For tagged releases, use master unless you replace this
            # with a specific Telegram commit/tag.
            echo "upstream_ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # Linux AMD64
  # ============================================================

  linux-amd64:
    name: Linux AMD64
    needs: resolve
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            g++ \
            make \
            gperf \
            libssl-dev \
            zlib1g-dev

      - name: Clone Telegram Bot API
        run: |
          git clone --recursive \
            "$UPSTREAM_REPO" \
            telegram-bot-api

          cd telegram-bot-api
          git checkout "${{ needs.resolve.outputs.upstream_ref }}"
          git submodule update --init --recursive

      - name: Record source revision
        working-directory: telegram-bot-api
        run: |
          git rev-parse HEAD > source-commit.txt
          cat source-commit.txt

      - name: Build
        working-directory: telegram-bot-api
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

          cmake \
            --build build \
            --config Release \
            --parallel "$(nproc)"

          cmake \
            --install build

      - name: Package
        shell: bash
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME="telegram-bot-api-${VERSION}-linux-amd64"

          mkdir -p "dist/${NAME}"

          cp \
            telegram-bot-api/install/bin/telegram-bot-api \
            "dist/${NAME}/"

          test -f LICENSE_1_0.txt

          cp \
            LICENSE_1_0.txt \
            "dist/${NAME}/"

          cp \
            telegram-bot-api/source-commit.txt \
            "dist/${NAME}/"

          tar \
            -C dist \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"

          sha256sum \
            "dist/${NAME}.tar.gz" \
            > "dist/${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/

  # ============================================================
  # Linux ARM64
  # ============================================================

