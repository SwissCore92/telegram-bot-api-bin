          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/

  windows-amd64:
    name: Windows AMD64
    needs: resolve
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Telegram Bot API
        shell: pwsh
        run: |
          git clone --recursive `
            "$env:UPSTREAM_REPO" `
            telegram-bot-api

          Set-Location telegram-bot-api
          git fetch --all --tags
          git checkout "${{ needs.resolve.outputs.upstream_commit }}"
          git submodule update --init --recursive

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone `
            --depth 1 `
            --branch "$env:VCPKG_VERSION" `
            https://github.com/microsoft/vcpkg.git `
            "$env:GITHUB_WORKSPACE\vcpkg"

          Set-Location "$env:GITHUB_WORKSPACE\vcpkg"
          .\bootstrap-vcpkg.bat

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-x64-windows-${{ env.VCPKG_VERSION }}-openssl-zlib-gperf

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          $cache = "$env:GITHUB_WORKSPACE\vcpkg-cache"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $cache | Out-Null

          "VCPKG_DEFAULT_BINARY_CACHE=$cache" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          Write-Host "vcpkg binary cache: $cache"

      - name: Install dependencies
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          & "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe" install `
            gperf:x64-windows `
            openssl:x64-windows `
            zlib:x64-windows

      - name: Record source revision
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          git rev-parse HEAD |
            Out-File source-commit.txt -Encoding ascii

          Get-Content source-commit.txt

      - name: Configure
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          cmake `
            -S . `
            -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel

      - name: Install
        shell: pwsh
        working-directory: telegram-bot-api
        run: |
          cmake `
            --install build `
            --config Release

      - name: Package
        shell: pwsh
        run: |
          $VERSION = "${{ needs.resolve.outputs.version }}"
          $NAME = "telegram-bot-api-$VERSION-windows-amd64"

          New-Item `
            -ItemType Directory `
            -Force `
            "dist/$NAME" | Out-Null

          Copy-Item `
            "telegram-bot-api/install/bin/telegram-bot-api.exe" `
            "dist/$NAME/"

          if (-not (Test-Path "LICENSE_1_0.txt")) {
            throw "LICENSE_1_0.txt is missing from the repository."
          }

          Copy-Item `
            "LICENSE_1_0.txt" `
            "dist/$NAME/"

          Copy-Item `
            "telegram-bot-api/source-commit.txt" `
            "dist/$NAME/"

          Get-ChildItem `
            "telegram-bot-api/install/bin/*.dll" `
            -ErrorAction SilentlyContinue |
            Copy-Item -Destination "dist/$NAME/"

          Compress-Archive `
            -Path "dist/$NAME/*" `
            -DestinationPath "dist/$NAME.zip"

          $hash = (
            Get-FileHash `
              "dist/$NAME.zip" `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  $NAME.zip" |
            Out-File `
              "dist/$NAME.zip.sha256" `
              -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: dist/

  macos-amd64:
    name: macOS Intel
    needs: resolve
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            gperf \
            openssl \
            zlib

      - name: Clone Telegram Bot API
        run: |
          git clone --recursive \
            "$UPSTREAM_REPO" \
            telegram-bot-api

          cd telegram-bot-api
          git fetch --all --tags
          git checkout "${{ needs.resolve.outputs.upstream_commit }}"
          git submodule update --init --recursive

      - name: Record source revision
        working-directory: telegram-bot-api
        run: |
          git rev-parse HEAD > source-commit.txt
          cat source-commit.txt

      - name: Build
        working-directory: telegram-bot-api
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"

          cmake \
            --build build \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

          cmake \
            --install build

      - name: Package
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME="telegram-bot-api-${VERSION}-macos-amd64"

          mkdir -p "dist/${NAME}"

          cp telegram-bot-api/install/bin/telegram-bot-api \
            "dist/${NAME}/"

          test -f LICENSE_1_0.txt
          cp LICENSE_1_0.txt \
            "dist/${NAME}/"

          cp telegram-bot-api/source-commit.txt \
            "dist/${NAME}/"

          tar \
            -C dist \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"

          (
            cd dist
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-amd64
          path: dist/

  macos-arm64:
    name: macOS Apple Silicon
    needs: resolve
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            gperf \
            openssl \
            zlib

      - name: Clone Telegram Bot API
        run: |
          git clone --recursive \
            "$UPSTREAM_REPO" \
            telegram-bot-api

          cd telegram-bot-api
          git fetch --all --tags
          git checkout "${{ needs.resolve.outputs.upstream_commit }}"
          git submodule update --init --recursive

      - name: Record source revision
        working-directory: telegram-bot-api
        run: |
          git rev-parse HEAD > source-commit.txt
          cat source-commit.txt

      - name: Build
        working-directory: telegram-bot-api
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"

          cmake \
            --build build \
            --config Release \
            --parallel "$(sysctl -n hw.ncpu)"

          cmake \
            --install build

      - name: Package
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          NAME="telegram-bot-api-${VERSION}-macos-arm64"

          mkdir -p "dist/${NAME}"

          cp telegram-bot-api/install/bin/telegram-bot-api \
            "dist/${NAME}/"

          test -f LICENSE_1_0.txt
          cp LICENSE_1_0.txt \
            "dist/${NAME}/"

          cp telegram-bot-api/source-commit.txt \
            "dist/${NAME}/"

          tar \
            -C dist \
            -czf "dist/${NAME}.tar.gz" \
            "${NAME}"

          (
            cd dist
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - resolve
      - linux-amd64
      - linux-arm64
      - windows-amd64
      - macos-amd64
      - macos-arm64

    runs-on: ubuntu-latest

    steps:
      - name: Download Linux AMD64
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: release

      - name: Download Linux ARM64
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: release

      - name: Download Windows AMD64
        uses: actions/download-artifact@v4
        with:
          name: windows-amd64
          path: release

      - name: Download macOS Intel
        uses: actions/download-artifact@v4
        with:
          name: macos-amd64
          path: release

      - name: Download macOS Apple Silicon
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release

      - name: Generate combined checksums
        working-directory: release
        shell: bash
        run: |
          cat *.sha256 > SHA256SUMS.txt

      - name: List release files
        run: |
          find release -maxdepth 1 -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          name: Telegram Bot API ${{ needs.resolve.outputs.version }}
          body: |
            ## Telegram Bot API ${{ needs.resolve.outputs.upstream_version }}

            Prebuilt Telegram Bot API server binaries for:

            - Linux AMD64
            - Linux ARM64
            - Windows AMD64
            - macOS Intel
            - macOS Apple Silicon

            ### Upstream source

            Repository: https://github.com/tdlib/telegram-bot-api
            Commit: `${{ needs.resolve.outputs.upstream_commit }}`

            The binaries were built from this exact upstream commit.

            Each release archive includes the Boost Software License 1.0.
          generate_release_notes: true
          prerelease: false
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
            release/SHA256SUMS.txt

